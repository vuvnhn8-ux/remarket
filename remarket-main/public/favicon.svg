  <!-- Letter R inside bag -->
  <text x="32" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="-1">R</text>
